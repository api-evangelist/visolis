aid: visolis
name: Visolis
description: >-
  Visolis is a biomanufacturing company that combines synthetic biology with
  chemical catalysis to convert plant biomass into MEV (mevalonic acid), a
  proprietary platform molecule used to make sustainable, bio-based alternatives
  to petroleum-derived chemicals and fuels. Its products include bio-isoprene
  for synthetic rubber (a partnership with Zeon), AroSAF 100% bio-based
  sustainable aviation fuel, and non-toxic bio-based industrial solvents
  (piloted with the U.S. Department of Defense). Headquartered in San Leandro,
  California and led by CEO Deepak Dugar, Visolis is a climate-tech company
  surfaced as a DCVC portfolio company and added to the API Evangelist network.
  As of this enrichment pass Visolis publishes a corporate marketing site but no
  public developer API, SDK, or documentation surface.
